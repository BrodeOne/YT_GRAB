name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl --retry 3 -sSfL -o src-tauri/binaries/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
      - name: Download ffmpeg
        run: |
          curl --retry 3 -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract -y
          EXTRACTED=$(ls -d ffmpeg_extract/*/)
          cp "$EXTRACTED/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg.exe
          rm -rf ffmpeg_extract ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl --retry 3 -sSfL -o src-tauri/binaries/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x src-tauri/binaries/yt-dlp_macos
      - name: Download ffmpeg
        run: |
          curl --retry 5 -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip" || \
          curl --retry 3 -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-8.1.1.zip"
          unzip -o ffmpeg.zip -d ffmpeg_extract
          if [ -f ffmpeg_extract/ffmpeg ]; then
            mv ffmpeg_extract/ffmpeg src-tauri/binaries/ffmpeg
          else
            FF=$(find ffmpeg_extract -name ffmpeg -type f | head -1)
            mv "$FF" src-tauri/binaries/ffmpeg
          fi
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
