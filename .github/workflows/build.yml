name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows-EXE
          path: src-tauri/target/release/yt-grab.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
