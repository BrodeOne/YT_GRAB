name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          7z x ffmpeg.zip -offmpeg_extract -y
          $extracted = Get-ChildItem -Path ffmpeg_extract -Directory | Select-Object -First 1
          Copy-Item "$($extracted.FullName)\bin\ffmpeg.exe" src-tauri\binaries\ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg_extract, ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x src-tauri/binaries/yt-dlp_macos
      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.zip"
          unzip -o ffmpeg.zip -d ffmpeg_extract
          EXTRACTED=$(ls -d ffmpeg_extract/*/)
          mv "$EXTRACTED/bin/ffmpeg" src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
