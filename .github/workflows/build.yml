name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp, ffmpeg, Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp, ffmpeg, Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh
      - name: Verify bundled binaries
        run: |
          echo "=== Bundled binaries ==="
          ls -lh src-tauri/binaries/
          [ -s src-tauri/binaries/yt-dlp_macos ] || { echo "MISSING: yt-dlp_macos"; exit 1; }
          [ -s src-tauri/binaries/yt-dlp ] || { echo "MISSING: yt-dlp"; exit 1; }
          [ -s src-tauri/binaries/ffmpeg ] || { echo "MISSING: ffmpeg"; exit 1; }
          [ -s src-tauri/binaries/deno ] || { echo "MISSING: deno"; exit 1; }
          echo "All binaries present and non-empty."
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
