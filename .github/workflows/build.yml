name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp + Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh
      - name: Download ffmpeg
        run: |
          curl --retry 3 -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract -y
          EXTRACTED=$(ls -d ffmpeg_extract/*/)
          cp "$EXTRACTED/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg.exe
          rm -rf ffmpeg_extract ffmpeg.zip
          if [ ! -s src-tauri/binaries/ffmpeg.exe ]; then echo "FAIL: ffmpeg.exe is empty or missing"; exit 1; fi
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp + Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh
      - name: Download ffmpeg
        run: |
          curl --retry 5 -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.zip" || true
          if [ ! -s ffmpeg.zip ]; then
            curl --retry 3 -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip" || true
          fi
          if [ ! -s ffmpeg.zip ]; then
            echo "FAIL: could not download ffmpeg"
            exit 1
          fi
          unzip -o ffmpeg.zip -d ffmpeg_extract
          if [ -f ffmpeg_extract/ffmpeg ]; then
            mv ffmpeg_extract/ffmpeg src-tauri/binaries/ffmpeg
          else
            FF=$(find ffmpeg_extract -name ffmpeg -type f | head -1)
            if [ -z "$FF" ]; then echo "FAIL: ffmpeg binary not found in zip"; exit 1; fi
            mv "$FF" src-tauri/binaries/ffmpeg
          fi
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip
          if [ ! -s src-tauri/binaries/ffmpeg ]; then echo "FAIL: ffmpeg is empty or missing"; exit 1; fi
          echo "ffmpeg: $(stat -f%z src-tauri/binaries/ffmpeg) bytes"
      - name: Verify bundled binaries
        run: |
          echo "=== Bundled binaries ==="
          ls -lh src-tauri/binaries/
          [ -s src-tauri/binaries/yt-dlp_macos ] || { echo "MISSING: yt-dlp_macos"; exit 1; }
          [ -s src-tauri/binaries/yt-dlp ] || { echo "MISSING: yt-dlp"; exit 1; }
          [ -s src-tauri/binaries/ffmpeg ] || { echo "MISSING: ffmpeg"; exit 1; }
          [ -s src-tauri/binaries/deno ] || { echo "MISSING: deno"; exit 1; }
          echo "All binaries present and non-empty."
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
