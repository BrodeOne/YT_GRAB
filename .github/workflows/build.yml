name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract
          copy ffmpeg_extract\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe src-tauri\binaries\ffmpeg.exe
          rmdir /s /q ffmpeg_extract
          del ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x src-tauri/binaries/yt-dlp_macos
      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -o ffmpeg.zip -d ffmpeg_extract
          mv ffmpeg_extract/ffmpeg src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip
      - name: Build
        run: npx tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
