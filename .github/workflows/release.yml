name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.ref_name }}".TrimStart('v') >> $env:GITHUB_OUTPUT
          }

      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          7z x ffmpeg.zip -offmpeg_extract -y
          $extracted = Get-ChildItem -Path ffmpeg_extract -Directory | Select-Object -First 1
          Copy-Item "$($extracted.FullName)\bin\ffmpeg.exe" src-tauri\binaries\ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg_extract, ffmpeg.zip

      - name: Build
        run: npx tauri build

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (Windows)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — Windows

            Standalone installer for Windows 10 / Windows 11 (x64).
            **No prerequisites.** yt-dlp and ffmpeg are bundled inside.

            1. Download `YT Grab_${{ steps.ver.outputs.value }}_x64.msi`
            2. Run the installer
            3. Launch from Start Menu
          files: src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x src-tauri/binaries/yt-dlp_macos

      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.zip"
          unzip -o ffmpeg.zip -d ffmpeg_extract
          EXTRACTED=$(ls -d ffmpeg_extract/*/)
          mv "$EXTRACTED/bin/ffmpeg" src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip

      - name: Build
        run: npx tauri build

      - name: Create macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (macOS)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — macOS

            Standalone installer for macOS 11+ (Intel / Apple Silicon).
            **No prerequisites.** yt-dlp and ffmpeg are bundled inside.

            1. Download `YT Grab_${{ steps.ver.outputs.value }}_aarch64.dmg`
            2. Open the .dmg
            3. Drag YT Grab to Applications
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
