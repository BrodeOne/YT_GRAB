name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download yt-dlp, ffmpeg, Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh

      - name: Build
        run: npx tauri build

      - name: Create Windows Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (Windows)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — Windows

            Standalone installer. No prerequisites — yt-dlp, ffmpeg, and Deno bundled inside.

            1. Download `.msi`
            2. Run the installer
            3. Launch from Start Menu
          files: src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download yt-dlp, ffmpeg, Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh

      - name: Verify bundled binaries
        run: |
          ls -lh src-tauri/binaries/
          [ -s src-tauri/binaries/yt-dlp_macos ] || exit 1
          [ -s src-tauri/binaries/yt-dlp ] || exit 1
          [ -s src-tauri/binaries/ffmpeg ] || exit 1
          [ -s src-tauri/binaries/deno ] || exit 1
          echo "All binaries OK."

      - name: Build
        run: npx tauri build

      - name: Create macOS Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: macos-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (macOS)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — macOS

            Standalone installer. No prerequisites — yt-dlp, ffmpeg, and Deno bundled inside.

            1. Download `.dmg`
            2. Open and drag to Applications
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
