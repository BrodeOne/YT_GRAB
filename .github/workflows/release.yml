name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download yt-dlp + Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh

      - name: Download ffmpeg
        run: |
          curl --retry 3 -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract -y
          EXTRACTED=$(ls -d ffmpeg_extract/*/)
          cp "$EXTRACTED/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg.exe
          rm -rf ffmpeg_extract ffmpeg.zip

      - name: Build
        run: npx tauri build

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (Windows)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — Windows

            Standalone installer. No prerequisites — yt-dlp, ffmpeg, and Deno bundled inside.

            1. Download `.msi`
            2. Run the installer
            3. Launch from Start Menu
          files: src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install

      - name: Set version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download yt-dlp + Deno (pinned, checksum-verified)
        run: bash scripts/fetch-binaries.sh

      - name: Download ffmpeg
        run: |
          curl --retry 5 -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-macos64-gpl.zip" || true
          if [ ! -s ffmpeg.zip ]; then
            curl --retry 3 -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip" || true
          fi
          if [ ! -s ffmpeg.zip ]; then echo "FAIL: could not download ffmpeg"; exit 1; fi
          unzip -o ffmpeg.zip -d ffmpeg_extract
          if [ -f ffmpeg_extract/ffmpeg ]; then
            mv ffmpeg_extract/ffmpeg src-tauri/binaries/ffmpeg
          else
            FF=$(find ffmpeg_extract -name ffmpeg -type f | head -1)
            if [ -z "$FF" ]; then echo "FAIL: ffmpeg not found in zip"; exit 1; fi
            mv "$FF" src-tauri/binaries/ffmpeg
          fi
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip
          if [ ! -s src-tauri/binaries/ffmpeg ]; then echo "FAIL: ffmpeg is empty"; exit 1; fi

      - name: Verify bundled binaries
        run: |
          ls -lh src-tauri/binaries/
          [ -s src-tauri/binaries/yt-dlp_macos ] || exit 1
          [ -s src-tauri/binaries/yt-dlp ] || exit 1
          [ -s src-tauri/binaries/ffmpeg ] || exit 1
          [ -s src-tauri/binaries/deno ] || exit 1
          echo "All binaries OK."

      - name: Build
        run: npx tauri build

      - name: Create macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ steps.ver.outputs.value }}
          name: "YT Grab v${{ steps.ver.outputs.value }} (macOS)"
          body: |
            ## YT Grab v${{ steps.ver.outputs.value }} — macOS

            Standalone installer. No prerequisites — yt-dlp, ffmpeg, and Deno bundled inside.

            1. Download `.dmg`
            2. Open and drag to Applications
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
