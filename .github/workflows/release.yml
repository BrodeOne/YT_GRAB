name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            echo "value=$tag" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract -y
          copy ffmpeg_extract\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe src-tauri\binaries\ffmpeg.exe
          rmdir /s /q ffmpeg_extract
          del ffmpeg.zip

      - name: Build
        run: npx tauri build

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-Windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.version.outputs.value }}
          name: "YT Grab v${{ steps.version.outputs.value }} (Windows)"
          body: |
            ## YT Grab v${{ steps.version.outputs.value }} — Windows

            Standalone installer for Windows 10 / Windows 11 (x64).

            **No prerequisites.** Everything is bundled inside — yt-dlp, ffmpeg, and all dependencies.

            ### Install
            1. Download `YT Grab_${{ steps.version.outputs.value }}_x64.msi`
            2. Run the installer
            3. Launch YT Grab from the Start Menu

            ### Features
            - Paste a YouTube URL → auto-fetch metadata and formats
            - Combos tab: pre-paired video + audio for every resolution (MP4 recommended)
            - Audio tab: audio-only download
            - Video tab: video-only with auto-merge
            - Live progress bar with speed, ETA, and downloaded size
            - Open File button after download completes
            - 🐽 Auto-fetch on paste (clipboard sniffing)
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Download yt-dlp
        run: |
          mkdir -p src-tauri/binaries
          curl -sSfL -o src-tauri/binaries/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x src-tauri/binaries/yt-dlp_macos

      - name: Download ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -o ffmpeg.zip -d ffmpeg_extract
          mv ffmpeg_extract/ffmpeg src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg
          rm -rf ffmpeg_extract ffmpeg.zip

      - name: Build
        run: npx tauri build

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Grab-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Create macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ steps.version.outputs.value }}
          name: "YT Grab v${{ steps.version.outputs.value }} (macOS)"
          body: |
            ## YT Grab v${{ steps.version.outputs.value }} — macOS

            Standalone installer for macOS 11+ (Apple Silicon / Intel).

            **No prerequisites.** Everything is bundled inside — yt-dlp, ffmpeg, and all dependencies.

            ### Install
            1. Download `YT Grab_${{ steps.version.outputs.value }}_aarch64.dmg`
            2. Open the .dmg
            3. Drag YT Grab to Applications

            > **Note:** If macOS blocks the app, go to **System Settings → Privacy & Security** and click **Open Anyway**.

            ### Features
            - Paste a YouTube URL → auto-fetch metadata and formats
            - Combos tab: pre-paired video + audio for every resolution (MP4 recommended)
            - Audio tab: audio-only download
            - Video tab: video-only with auto-merge
            - Live progress bar with speed, ETA, and downloaded size
            - Open File button after download completes
            - 🐽 Auto-fetch on paste (clipboard sniffing)
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
